<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toprak Gayrimenkul Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.1.7/dist/core.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--ax-bg-page);
      color: var(--ax-text-primary);
    }
    :root {
      --ax-bg-page: #0f1117;
      --ax-bg-surface: #1a1d27;
      --ax-bg-elevated: #242736;
      --ax-text-primary: #e8eaed;
      --ax-text-secondary: #9aa0a6;
      --ax-border: #2d3140;
      --ax-primary: #4a8eff;
      --ax-primary-hover: #3a7eef;
      --ax-success: #34a853;
      --ax-error: #ea4335;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--ax-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ax-text-secondary); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
